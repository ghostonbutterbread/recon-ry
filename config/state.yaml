# Tool and Stage State Configuration
# Tracks which tools and stages are enabled/disabled.
# NOTE: Comments are stripped when the TUI writes updates.

tools:
  # -- subdomain_enum -----------------------------------------------------------
  subfinder: true
  crt_sh: true
  assetfinder: true
  amass: false

  # -- url_discovery ------------------------------------------------------------
  katana: false
  hakrawler: false
  waybackurls: true
  gau: true

  # -- alive_check --------------------------------------------------------------
  httpx: true

  # -- param_discovery ----------------------------------------------------------
  param_recon: true
  passive_param_recon: true
  waymore: true
  xnlinkfinder: true
  uro: true
  js_files: true
  unclutter_jsfiles: true

  # -- dir_enum -----------------------------------------------------------------
  ffuf: true

  # -- secret_scan --------------------------------------------------------------
  nuclei: false
  trufflehog: false
  secret_finder: true

  # -- eyewitness ---------------------------------------------------------------
  eyewitness: true

  # -- dork (standalone) --------------------------------------------------------
  dork_scan: false

  # -- legacy / unused ----------------------------------------------------------
  gospider: false
  gau_params: false

stages:
  # Full profile run order
  subdomain_enum: true
  url_discovery: true
  passive_url_discovery: true
  alive_check: true
  param_discovery: true
  passive_param_discovery: true
  passive_param_normalize: true
  dir_enum: true
  secret_scan: true
  eyewitness: true

  # Standalone profiles
  dork: false
