# Profile definitions
# Each profile specifies which stages to run

profiles:
  full:
    description: "Full reconnaissance scan"
    stages:
      - subdomain_enum
      - url_discovery
      - alive_check
      - get_ips
      - port_enrichment
      - http_fingerprinting
      - param_discovery
      - dir_enum
      - secret_scan
      - url_ranking
      - eyewitness

  subs:
    description: "Subdomain enumeration only"
    stages:
      - subdomain_enum

  secrets:
    description: "Secret scanning on existing data"
    stages:
      - secret_scan

  dork:
    description: "Google dorking"
    stages:
      - dork

  eye:
    description: "EyeWitness screenshots and report"
    stages:
      - eyewitness

  fast:
    description: "Quick scan (subdomain + alive check)"
    stages:
      - subdomain_enum
      - alive_check

  urls:
    description: "URL discovery and alive check (requires wild.txt)"
    stages:
      - url_discovery
      - alive_check

  passive:
    description: "Passive archive URL and parameter discovery"
    stages:
      - passive_url_discovery
      - passive_param_discovery
      - passive_param_normalize

  fingerprint:
    description: "Enrich existing live hosts and rank review targets"
    stages:
      - get_ips
      - port_enrichment
      - http_fingerprinting
      - url_ranking

  params:
    description: "Parameter discovery (param_recon)"
    stages:
      - param_discovery
