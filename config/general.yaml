# General configuration for recon framework

# Default settings
defaults:
  timeout: 300  # Default timeout for tools in seconds
  threads: 50   # Default thread count for tools that support it
  retries: 3    # Number of retries for failed tools

# Stage configuration
stages:
  subdomain_enum:
    enabled: true
    parallel: true
    description: "Subdomain enumeration"
    tools:
      - subfinder
      - crt_sh
      - assetfinder
      - amass

  url_discovery:
    enabled: true
    parallel: false
    depends_on: [subdomain_enum]
    description: "URL discovery and crawling"
    tools:
      - katana
      - hakrawler
      - waybackurls
      - gau

  alive_check:
    enabled: true
    parallel: false
    depends_on: [url_discovery]
    description: "Check alive hosts and services"
    tools:
      - httpx

  get_ips:
    enabled: true
    parallel: false
    depends_on: [url_discovery]
    description: "Extract URL-corpus IP sidecars"
    tools:
      - get_ips

  port_enrichment:
    enabled: true
    parallel: false
    depends_on: [get_ips]
    description: "Fast port enrichment"
    tools:
      - naabu

  http_fingerprinting:
    enabled: true
    parallel: false
    depends_on: [alive_check]
    description: "HTTP technology, CDN, and WAF fingerprinting"
    tools:
      - http_fingerprinting

  param_discovery:
    enabled: true
    parallel: false
    depends_on: [alive_check]
    description: "Parameter discovery"
    tools:
      - gau_params
      - uro
      - js_files
      - unclutter_jsfiles

  dir_enum:
    enabled: true
    parallel: true
    depends_on: [alive_check]
    description: "Directory enumeration"
    tools:
      - ffuf
      - dirsearch

  secret_scan:
    enabled: true
    parallel: false
    depends_on: [url_discovery]
    description: "Secret and sensitive data scanning"
    tools:
      - nuclei_secrets
      - trufflehog
      - secret_finder

  dork:
    enabled: true
    parallel: false
    description: "Google dorking"
    tools:
      - dork_scan

  url_ranking:
    enabled: true
    parallel: false
    depends_on: [http_fingerprinting]
    description: "Rank live URLs for focused manual and agent review"
    tools:
      - url_ranking

# Tool definitions
tools:
  # Subdomain Enumeration
  subfinder:
    enabled: true
    type: binary  # Requires binary installation
    command: "subfinder -d {{DOMAIN}} -all -silent -o {{OUTPUT}}"
    required_files: []
    outputs: [wild.txt]

  crt_sh:
    enabled: true
    type: inline  # Not a binary, just a command
    command: "curl -s 'https://crt.sh/?q=%25.{{DOMAIN}}&output=json' | jq -r '.[].name_value' | sed 's/*.//g' | sort -u"
    required_files: []
    outputs: [wild.txt]

  assetfinder:
    enabled: true
    type: binary
    command: "assetfinder --subs-only {{DOMAIN}}"
    required_files: []
    outputs: [wild.txt]

  amass:
    enabled: true
    type: binary
    command: "amass enum -passive -d {{DOMAIN}} -silent"
    required_files: []
    outputs: [wild.txt]

  # URL Discovery
  katana:
    enabled: true
    type: binary
    command: "katana -list {{INPUT}} -d 3 -silent -jc -kf all -o {{OUTPUT}}"
    required_files: [wild.txt]
    outputs: [urls.txt]

  hakrawler:
    enabled: true
    type: binary
    command: "cat {{INPUT}} | hakrawler -d 3 -plain > {{OUTPUT}}"
    required_files: [wild.txt]
    outputs: [urls.txt]

  waybackurls:
    enabled: true
    type: binary
    command: "cat {{INPUT}} | waybackurls > {{OUTPUT}}"
    required_files: [wild.txt]
    outputs: [urls.txt]

  gau:
    enabled: true
    type: binary
    command: "cat {{INPUT}} | gau --threads 5 --blacklist png,jpg,gif,jpeg,swf,woff,svg,pdf > {{OUTPUT}}"
    required_files: [wild.txt]
    outputs: [urls.txt]

  # Alive Check
  httpx:
    enabled: true
    type: binary
    command: "httpx -list {{INPUT}} -silent -mc 200,201,202,203,204,301,302,307,308,401,403,405 -o {{OUTPUT}}"
    required_files: [urls.txt]
    outputs: [alive.txt]

  # Host and HTTP Enrichment
  get_ips:
    enabled: true
    type: inline
    command: "python3 {{SCRIPT_DIR}}/scripts/recon_enrichment.py get-ips --input {{INPUT}} --output {{OUTPUT}} --project-dir {{PROJECT_DIR}} --rate-limit {{RATE_LIMIT}}"
    required_files: [urls.txt]
    outputs: [ips.txt]

  naabu:
    enabled: true
    type: binary
    top_ports: 1000
    command: "python3 {{SCRIPT_DIR}}/scripts/recon_enrichment.py run-naabu --input {{INPUT}} --output {{OUTPUT}} --project-dir {{PROJECT_DIR}} --top-ports {{TOP_PORTS}} --rate-limit {{RATE_LIMIT}}"
    required_files: [ips.txt]
    outputs: [naabu.jsonl]

  http_fingerprinting:
    enabled: true
    type: binary
    json: true
    tech_detect: true
    cdn_detect: true
    waf_tagging: true
    filter_mode: tag_only
    command: "python3 {{SCRIPT_DIR}}/scripts/recon_enrichment.py run-httpx --input {{INPUT}} --output {{OUTPUT}} --project-dir {{PROJECT_DIR}} --rate-limit {{RATE_LIMIT}}"
    required_files: [alive.txt]
    outputs: [httpx.jsonl]

  # Parameter Discovery
  gau_params:
    enabled: true
    type: inline # gau normal run will check install
    command: "cat {{INPUT}} | gau --threads 5 --blacklist png,jpg,gif,jpeg,swf,woff,svg,pdf | grep '=' > {{OUTPUT}}"
    required_files: [alive.txt]
    outputs: [params_raw.txt]

  uro:
    enabled: true
    type: binary
    command: "cat {{INPUT}} | uro -o {{OUTPUT}}"
    required_files: [params_raw.txt]
    outputs: [params.txt]

  js_files:
    enabled: true
    type: inline
    command: "cat {{INPUT}} | grep '.js$' > {{OUTPUT}}"
    required_files: [params.txt]
    outputs: [jsfiles.txt]

  unclutter_jsfiles:
    enabled: true
    type: inline
    command: "cat {{INPUT}} | uro | anew {{OUTPUT}}"
    required_files: [jsfiles.txt]
    outputs: [jsfiles.txt]

  # Directory Enumeration
  ffuf:
    enabled: true
    type: binary
    command: "ffuf -u {{URL}}/FUZZ -w /usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt -mc 200,204,301,302,307,401,403 -o {{OUTPUT}} -of json"
    required_files: [alive.txt]
    outputs: [dirs.txt]

  dirsearch:
    enabled: true
    type: binary
    command: "dirsearch -u {{URL}} -e php,asp,aspx,jsp,html,zip,jar -t 50 --plain-text-report={{OUTPUT}}"
    required_files: [alive.txt]
    outputs: [dirs.txt]

  # Secret Scanning
  nuclei_secrets:
    enabled: true
    type: binary
    command: "nuclei -list {{INPUT}} -t ~/nuclei-templates/exposures/ -silent -o {{OUTPUT}}"
    required_files: [urls.txt]
    outputs: [secrets.txt]

  trufflehog:
    enabled: true
    type: binary
    command: "trufflehog filesystem {{PROJECT_DIR}} --json --no-update"
    required_files: []
    outputs: [secrets.txt]

  secret_finder:
    enabled: true
    type: script
    command: "cat {{INPUT}} | while read url; do python3 {{SECRETFINDER_DIR}}/SecretFinder.py -i \"$url\" -o cli >> {{OUTPUT}}; done"
    required_files: [jsfiles.txt]
    outputs: [secrets.txt]

  # Google Dorking
  dork_scan:
    enabled: true
    type: inline
    command: "echo 'Manual dorking for: site:{{DOMAIN}} inurl:admin OR inurl:login OR inurl:api'"
    required_files: []
    outputs: [dorks.txt]

  # Review Queue Ranking
  url_ranking:
    enabled: true
    type: inline
    command: "python3 {{SCRIPT_DIR}}/scripts/recon_enrichment.py rank-urls --output {{OUTPUT}} --project-dir {{PROJECT_DIR}}"
    required_files: [alive.txt]
    outputs: [review_queue.jsonl]
